name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Secret scan
        run: npm run security:secrets

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_management_test
      E2E_STAFF_EMAIL: admin@demo-clinic.local
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      PLATFORM_ADMIN_EMAIL: platform-admin@e2e.local

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate E2E staff credential is configured
        run: test -n "$E2E_STAFF_PASSWORD"

      - name: Generate ephemeral Platform Control E2E credentials
        shell: bash
        run: |
          set -euo pipefail

          platform_admin_password="$(node -e 'console.log(require("node:crypto").randomBytes(24).toString("base64url"))')"
          platform_admin_mfa_secret="$(node - <<'NODE'
          const crypto = require("node:crypto");
          const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
          const bytes = crypto.randomBytes(20);
          let bits = "";
          for (const byte of bytes) bits += byte.toString(2).padStart(8, "0");
          let secret = "";
          for (let i = 0; i + 5 <= bits.length; i += 5) secret += alphabet[parseInt(bits.slice(i, i + 5), 2)];
          process.stdout.write(secret);
          NODE
          )"
          platform_auth_encryption_key="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"

          echo "::add-mask::$platform_admin_password"
          echo "::add-mask::$platform_admin_mfa_secret"
          echo "::add-mask::$platform_auth_encryption_key"

          {
            printf 'PLATFORM_ADMIN_PASSWORD=%s\n' "$platform_admin_password"
            printf 'PLATFORM_ADMIN_MFA_SECRET=%s\n' "$platform_admin_mfa_secret"
            printf 'PLATFORM_AUTH_ENCRYPTION_KEY=%s\n' "$platform_auth_encryption_key"
          } >> "$GITHUB_ENV"

          unset platform_admin_password platform_admin_mfa_secret platform_auth_encryption_key

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed isolated E2E database
        run: npx --yes prisma@6.19.3 db seed

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/e2e/mock-server-only.cjs
        run: npm run test:e2e
