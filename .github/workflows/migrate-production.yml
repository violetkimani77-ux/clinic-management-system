name: Apply production database migrations

on:
  push:
    branches:
      - main
    paths:
      - "prisma/migrations/**"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Keep production database credentials scoped to this deployment environment.
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        run: npx --no-install prisma@6.19.3 validate

      - name: Apply pending production migrations
        run: npx --no-install prisma@6.19.3 migrate deploy
